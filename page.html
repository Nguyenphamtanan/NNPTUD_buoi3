<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Posts and Comments</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
        }

        h1, h3 {
            color: #333;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            text-align: left;
            padding: 10px;
            border: 1px solid #ddd;
        }

        th {
            background-color: #f4f4f4;
        }

        /* Zebra rows: alternating black and white rows */
        tr:nth-child(odd) {
            background-color: #000;
            color: #fff;
        }
        tr:nth-child(even) {
            background-color: #fff;
            color: #000;
        }
        tr:hover {
            background-color: #444;
            color: #fff;
        }

        .deleted {
            color: gray;
            text-decoration: line-through;
            opacity: 0.6;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 600px;
            margin: 0 auto 20px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }

        input[type="text"], input[type="number"] {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 14px;
            width: 100%;
        }

        input[type="submit"] {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 3px;
        }

        input[type="submit"]:hover {
            background-color: #218838;
        }

        .actions button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 5px 10px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 3px;
        }

        .actions .delete {
            background-color: #dc3545;
        }

        .actions .delete:hover {
            background-color: #c82333;
        }

        .actions .restore {
            background-color: #ffc107;
            color: black;
        }

        .actions .restore:hover {
            background-color: #e0a800;
        }
        /* Product table image styling: show full image */
        .product-img {
            width: 120px;
            height: 80px;
            object-fit: cover;
            display: block;
            margin: 4px auto;
            background: #eee;
        }
        td img { display:block; }
        .controls { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
        .controls input[type="text"] { padding:6px; }
        .controls select, .controls button { padding:6px 8px; }

        /* Placeholder image styling */
        img[alt="No image"] {
            background-color: #ddd;
            display: block;
            width: 120px;
            height: 80px;
            text-align: center;
            vertical-align: middle;
        }
    </style>
    <script defer src="main.js"></script>
</head>
<body>
    <h1>Manage Products</h1>
    <div class="controls">
        <input id="product-search" type="text" placeholder="Search by title...">
        <label>Show:
            <select id="page-size">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="20">20</option>
            </select>
        </label>
        <button id="sort-price">Sort Price ▲/▼</button>
        <button id="sort-title">Sort Name A/Ž</button>
    </div>
    <div>
        <table id="post-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Title</th>
                    <th>Price</th>
                    <th>Category</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="post-body">
                <!-- Posts content will be dynamically added here -->
            </tbody>
        </table>
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div id="pagination-info"></div>
            <div>
                <button id="prev-page">Prev</button>
                <button id="next-page">Next</button>
            </div>
        </div>
    </div>
    <!-- Ensure your products include valid images in the dataset -->
</body>
</html>
